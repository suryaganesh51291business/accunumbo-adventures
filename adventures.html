<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AccuNumbo Adventures — Adventure 1</title>

<style>
:root{
  --navy:#14213d;
  --blue:#2563eb;
  --purple:#7c3aed;
  --teal:#14b8a6;
  --gold:#f59e0b;
  --green:#22c55e;
  --red:#ef4444;
  --ink:#172033;
  --muted:#64748b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:linear-gradient(180deg,#edf6ff,#faf7ff);
  color:var(--ink);
  min-height:100vh
}

header{
  height:72px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  box-shadow:0 5px 20px #0002
}

.logo{
  font-weight:950;
  letter-spacing:.4px
}

.logo span{
  color:#fbbf24
}

.head{
  display:flex;
  align-items:center;
  gap:8px
}

.pill{
  background:#ffffff18;
  border:1px solid #ffffff2a;
  border-radius:99px;
  padding:8px 12px;
  font-weight:900
}

.sound{
  border:0;
  background:#ffffff18;
  color:#fff;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:18px;
  cursor:pointer
}

main{
  max-width:950px;
  margin:auto;
  padding:25px 17px 55px
}

.crumb{
  font-size:14px;
  color:var(--muted);
  font-weight:850;
  margin-bottom:15px
}

.prog{
  display:flex;
  justify-content:space-between;
  font-weight:950;
  margin-bottom:7px
}

.bar{
  height:10px;
  background:#dbeafe;
  border-radius:99px;
  overflow:hidden
}

.fill{
  height:100%;
  width:10%;
  background:linear-gradient(90deg,var(--teal),var(--purple));
  transition:.45s
}

.card{
  background:#fff;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 18px 50px #17203318;
  margin-top:18px
}

.hero{
  padding:27px 30px;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--purple))
}

.hero h1{
  font-size:clamp(28px,5vw,44px);
  margin:12px 0 5px
}

.hero p{
  margin:0
}

.badge{
  display:inline-block;
  background:#ffffff25;
  border:1px solid #ffffff45;
  padding:7px 12px;
  border-radius:99px;
  font-size:12px;
  font-weight:950
}

.body{
  padding:30px
}

.bot{
  display:flex;
  gap:14px;
  align-items:flex-start
}

.avatar{
  width:64px;
  height:64px;
  flex:0 0 64px;
  border-radius:20px;
  background:#fff7d6;
  display:grid;
  place-items:center;
  font-size:38px
}

.bubble{
  background:#f8fafc;
  border-radius:18px;
  padding:15px;
  line-height:1.55
}

.bubble b{
  color:var(--blue)
}

.scenario{
  margin:20px 0;
  padding:21px;
  background:#fffaf0;
  border:2px dashed #f2c14e;
  border-radius:20px;
  text-align:center;
  font-size:18px;
  line-height:1.6
}

h2{
  text-align:center;
  margin:18px 0 5px
}

.hint{
  text-align:center;
  color:var(--muted);
  font-weight:700;
  margin-bottom:15px
}

.timer{
  text-align:center;
  font-size:23px;
  font-weight:950;
  margin:12px auto 18px;
  padding:9px 15px;
  border-radius:99px;
  background:#eff6ff;
  width:max-content
}

.timer.warn{
  background:#fff7ed;
  color:#c2410c
}

.timer.danger{
  background:#fee2e2;
  color:#b91c1c;
  animation:pulse .7s infinite
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px
}

.term,
.sortcard{
  border:2px solid #dbeafe;
  background:#fff;
  border-radius:17px;
  padding:16px;
  text-align:center;
  font-weight:950;
  cursor:grab;
  user-select:none;
  transition:.2s
}

.term:hover,
.sortcard:hover{
  transform:translateY(-3px);
  border-color:#60a5fa
}

.dragging{
  opacity:.45
}

.drop{
  min-height:75px;
  border:3px dashed #94a3b8;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  font-weight:900;
  padding:12px;
  margin-top:13px
}

.drop.over{
  border-color:var(--teal);
  background:#ecfdf5
}

.drop.correct{
  border-color:var(--green);
  background:#f0fdf4;
  color:#166534
}

.matchgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  align-items:center
}

.matchlabel{
  padding:15px;
  border-radius:16px;
  background:#f8fafc;
  font-weight:900
}

.select{
  width:100%;
  padding:14px;
  border:2px solid #dbeafe;
  border-radius:15px;
  font-weight:800;
  background:#fff
}

.scene{
  position:relative;
  background:linear-gradient(180deg,#dff7ff,#fff7df);
  border-radius:22px;
  padding:28px;
  min-height:260px;
  overflow:hidden
}

.sceneitem{
  position:absolute;
  font-size:52px;
  cursor:pointer;
  transition:.2s;
  text-align:center
}

.sceneitem:hover{
  transform:scale(1.14)
}

.sceneitem small{
  display:block;
  font-size:12px;
  background:#fff;
  padding:4px 7px;
  border-radius:99px;
  font-weight:900
}

.sortarea{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.bucket{
  min-height:175px;
  border:3px dashed #a5b4fc;
  border-radius:20px;
  padding:13px;
  background:#fafaff
}

.bucket h3{
  text-align:center;
  margin:4px
}

.bucket.over{
  background:#eef2ff;
  border-color:var(--purple)
}

.bucket .sortcard{
  margin:8px 0
}

.answerbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center
}

.answerbar button{
  border:2px solid #dbeafe;
  background:#fff;
  border-radius:15px;
  padding:14px 18px;
  font-weight:950;
  cursor:pointer
}

.story{
  background:#fffaf0;
  border:2px solid #f2c14e;
  border-radius:20px;
  padding:20px;
  line-height:1.9
}

.storydrop{
  display:inline-flex;
  min-width:145px;
  min-height:40px;
  vertical-align:middle;
  border:2px dashed #94a3b8;
  border-radius:12px;
  align-items:center;
  justify-content:center;
  padding:3px 9px;
  margin:3px
}

.storyterms{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  justify-content:center;
  margin:15px 0
}

.feedback{
  display:none;
  margin-top:19px;
  border-radius:20px;
  padding:20px;
  line-height:1.6
}

.feedback.show{
  display:block
}

.good{
  background:#dcfce7;
  color:#166534
}

.try{
  background:#fff7ed;
  color:#9a3412
}

.ft{
  font-size:27px;
  font-weight:950
}

.big{
  font-size:65px;
  line-height:1.05
}

.rewards{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:10px
}

.rewards span{
  background:#ffffffbb;
  padding:8px 12px;
  border-radius:99px;
  font-weight:950
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px
}

.btn{
  border:0;
  border-radius:15px;
  padding:14px 22px;
  font-weight:950;
  font-size:16px;
  cursor:pointer
}

.primary{
  background:var(--blue);
  color:#fff;
  box-shadow:0 8px 18px #2563eb44
}

.retry{
  background:var(--gold);
  color:#fff;
  display:none
}

.continue{
  display:none
}

.conf{
  position:fixed;
  z-index:20;
  pointer-events:none;
  animation:fall 1.5s ease-out forwards
}

@keyframes fall{
  to{
    opacity:0;
    transform:translateY(210px) scale(1.4) rotate(300deg)
  }
}

@keyframes pop{
  45%{transform:scale(1.07)}
}

@keyframes pulse{
  50%{transform:scale(1.05)}
}

.celebrate{
  animation:pop .55s 2
}

@media(max-width:700px){
  header{padding:0 12px}
  .pill{padding:7px 9px}
  .body{padding:22px}
  .hero{padding:25px 22px}
  .cards,
  .matchgrid,
  .sortarea{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ACCUNUMBO <span>ADVENTURES</span></div>

  <div class="head">
    <div class="pill">⭐ <span id="xp">0</span> XP</div>
    <div class="pill">🪙 <span id="coins">0</span></div>
    <button class="sound" id="sound">🔊</button>
  </div>
</header>

<main>

<div class="crumb">
  🏡 Accounting Village › 🌱 Adventure 1: Terminology Quest
</div>

<div class="prog">
  <span id="stepLabel">Task 1 of 10</span>
  <span id="pct">10%</span>
</div>

<div class="bar">
  <div class="fill" id="fill"></div>
</div>

<section class="card" id="card"></section>

</main>

<script>

const tasks=[

{
title:"Capital Drop",
sub:"🖐️ Drag & Drop",
time:30,
scenario:"Anu opens her bakery by introducing ₹50,000 of her own money into the business.",
kind:"drag",
prompt:"Drag the correct terminology into the target.",
items:[
"📦 Asset",
"💰 Capital",
"🧾 Expense",
"💵 Income"
],
answer:"💰 Capital",
why:"Capital is the money or other value introduced by the owner into the business."
},

{
title:"Terminology Match",
sub:"🔗 Matching Task 1",
time:45,
scenario:"Match each business event with the correct accounting terminology.",
kind:"match",
pairs:[
["Owner invests money","Capital"],
["Bakery oven owned","Asset"],
["Bank loan","Liability"],
["Rent paid","Expense"]
],
why:"Capital is owner investment; an Asset is a business resource; a Liability is an obligation; an Expense is a cost."
},

{
title:"Explore Anu's Bakery",
sub:"🏪 Business-Scene Interaction",
time:45,
scenario:"Walk around the bakery and tap the item that is an Asset.",
kind:"scene",
items:[
["🔥","Bakery Oven","Asset"],
["🏦","Bank Loan","Liability"],
["🧾","Rent","Expense"],
["💰","Owner Investment","Capital"]
],
answer:"Asset",
why:"The bakery oven is a valuable resource owned and used by the business, so it is an Asset."
},

{
title:"Sort the Accounts",
sub:"📦 Sorting Activity",
time:45,
scenario:"Drag every card into the correct bucket: Asset, Liability or Expense.",
kind:"sort",
cards:[
["🔥 Bakery Oven","Asset"],
["🏦 Bank Loan","Liability"],
["🪑 Furniture","Asset"],
["💡 Electricity","Expense"],
["🚚 Delivery Van","Asset"],
["🧾 Shop Rent","Expense"]
],
why:"Assets are valuable resources; Liabilities are amounts owed; Expenses are costs incurred to run the business."
},

{
title:"Nature Match",
sub:"🔗 Matching Task 2",
time:60,
scenario:"Match each account with its nature: Real, Personal or Nominal.",
kind:"match",
pairs:[
["Cash","Real Account"],
["Ravi Traders","Personal Account"],
["Rent","Nominal Account"],
["Machinery","Real Account"]
],
why:"Real Accounts relate to assets, Personal Accounts to persons/entities, and Nominal Accounts to expenses, losses, incomes and gains."
},

{
title:"Which Nature?",
sub:"🔍 Scenario-Based Identification",
time:45,
scenario:"The bakery pays ₹3,000 for electricity. What is the nature of Electricity Expense?",
kind:"identify",
choices:[
"🏭 Real Account",
"👤 Personal Account",
"💵 Nominal Account",
"💰 Capital Account"
],
answer:"💵 Nominal Account",
why:"Electricity is an expense. Expenses and losses belong to Nominal Accounts."
},

{
title:"Three-Way Match",
sub:"🔗 Matching Task 3",
time:60,
scenario:"Match the business event to BOTH its account and its nature.",
kind:"triple",
rows:[
["Bought machinery for cash","Machinery","Real Account"],
["Paid shop rent","Rent","Nominal Account"]
],
why:"Great! You connected the event, the account involved and its nature."
},

{
title:"Story Challenge 1",
sub:"🏆 Anu Opens the Bakery",
time:90,
scenario:"Complete Anu's opening-day story by dragging the right terminology into each gap.",
kind:"story",
story:[
["Anu introduces ₹1,00,000.","Capital"],
["She buys a delivery vehicle.","Asset"],
["She takes a bank loan.","Liability"],
["She pays shop rent.","Expense"]
],
terms:[
"Capital",
"Asset",
"Liability",
"Expense"
],
why:"Excellent! You identified the key terminology in Anu's opening-day story."
},

{
title:"Story Challenge 2",
sub:"🏆 A Busy Day at the Bakery",
time:120,
scenario:"Now apply terminology AND account nature to a busy business day.",
kind:"story",
story:[
["Anu sells cakes to customers.","Income"],
["She pays electricity.","Nominal Account"],
["She buys machinery.","Real Account"],
["She takes ₹3,000 for personal use.","Drawing"]
],
terms:[
"Income",
"Nominal Account",
"Real Account",
"Drawing"
],
why:"Fantastic! You applied terminology and account nature to real business events."
},

{
title:"Final Boss: Debit & Credit",
sub:"⚔️ Final Challenge",
time:120,
scenario:"The bakery receives ₹50,000 cash from the owner as capital. Apply the debit-credit rule.",
kind:"final",
choices:[
"⬅️ Debit Cash + Credit Capital",
"➡️ Credit Cash + Debit Capital",
"⬅️ Debit both",
"➡️ Credit both"
],
answer:"⬅️ Debit Cash + Credit Capital",
why:"Cash is a Real Account: debit what comes in. Capital is credited because the owner's investment increases the capital account."
}

];

let current=0;
let xp=0;
let coins=0;
let attempt=1;
let timer=null;
let timeLeft=0;
let soundOn=true;
let locked=false;

const $=id=>document.getElementById(id);

function beep(ok){

if(!soundOn)return;

const C=window.AudioContext||window.webkitAudioContext;

if(!C)return;

let c=new C();

let ns=ok
?[523,659,784,1047,1319]
:[330,277];

ns.forEach((f,i)=>{

let o=c.createOscillator();
let g=c.createGain();

o.type=ok?"triangle":"sine";
o.frequency.value=f;

o.connect(g);
g.connect(c.destination);

let t=c.currentTime+i*.1;

g.gain.setValueAtTime(.001,t);
g.gain.exponentialRampToValueAtTime(ok?.28:.13,t+.02);
g.gain.exponentialRampToValueAtTime(.001,t+(ok?.22:.2));

o.start(t);
o.stop(t+(ok?.25:.22));

});

}

function confetti(){

[
"🎉","✨","⭐","🏆","🌟",
"👏","🥳","🚀","🪙","🎊"
].forEach(e=>{

let s=document.createElement("span");

s.className="conf";
s.textContent=e;

s.style.left=(5+Math.random()*90)+"vw";
s.style.top=(10+Math.random()*35)+"vh";
s.style.fontSize=(22+Math.random()*35)+"px";

document.body.appendChild(s);

setTimeout(()=>s.remove(),1700);

});

}

function score(){

return attempt===1
?{xp:20,c:10,label:"PERFECT FIRST TRY!"}
:attempt===2
?{xp:10,c:5,label:"GREAT RECOVERY!"}
:{xp:5,c:2,label:"YOU DID IT!"};

}

function header(){

let t=tasks[current];

$("stepLabel").textContent=`Task ${current+1} of 10`;

$("pct").textContent=`${(current+1)*10}%`;

$("fill").style.width=`${(current+1)*10}%`;

$("xp").textContent=xp;

$("coins").textContent=coins;

}

function timerStart(seconds){

clearInterval(timer);

timeLeft=seconds;

let el=document.querySelector(".timer");

if(!el)return;

el.textContent=`⏱️ ${timeLeft}s`;

timer=setInterval(()=>{

timeLeft--;

if(el){

el.textContent=`⏱️ ${timeLeft}s`;

el.className=
"timer"+
(timeLeft<=10?" warn":"")+
(timeLeft<=5?" danger":"");

}

if(timeLeft<=0){

clearInterval(timer);

if(!locked){

locked=true;

wrong(
"⏰ Time is up. Take a breath, review the explanation and use your next attempt carefully."
);

$("retry").style.display="inline-block";

$("retry").textContent=
attempt>=3
?"➡️ Next Task"
:"🔄 Try Again";

}

}

},1000);

}

function shell(t,content){

$("card").innerHTML=`

<div class="hero">

<span class="badge">
ADVENTURE 01 • TASK ${current+1}
</span>

<h1>${t.title}</h1>

<p>${t.sub}</p>

</div>

<div class="body">

<div class="bot">

<div class="avatar">🤖</div>

<div class="bubble">

<b>AccuBot says:</b><br>

Think carefully, Explorer.
Your first correct answer earns the highest reward!

</div>

</div>

<div class="scenario">
${t.scenario}
</div>

<div class="timer">
⏱️ ${t.time}s
</div>

<div class="hint" id="attemptLabel">
Attempt ${attempt} of 3 • Options are shuffled • Answer is evaluated immediately
</div>

${content}

<div class="feedback" id="fb"></div>

<div class="actions">

<button class="btn retry" id="retry">
🔄 Try Again
</button>

<button class="btn primary continue" id="continue">
${current===9?"🏆 Finish Adventure":"Continue →"}
</button>

</div>

</div>
`;

}

function success(why){

if(locked)return;

locked=true;

clearInterval(timer);

let s=score();

xp+=s.xp;
coins+=s.c;

header();

let f=$("fb");

f.className="feedback show good";

f.innerHTML=`

<div class="big">🎉🏆🌟</div>

<div class="ft">
${s.label} 🥳👏
</div>

<p>${why}</p>

<div class="rewards">

<span>⭐ +${s.xp} XP</span>

<span>🪙 +${s.c} Coins</span>

</div>

`;

$("card").classList.add("celebrate");

$("continue").style.display="inline-block";

beep(true);

confetti();

}

function wrong(msg){

clearInterval(timer);

locked=true;

let f=$("fb");

f.className="feedback show try";

f.innerHTML=`

<div class="big" style="font-size:52px">
💪🌱🧠
</div>

<div class="ft">
Keep going! You can get this! 🚀
</div>

<p>💡 ${msg}</p>

`;

$("retry").style.display="inline-block";

$("retry").textContent=
attempt>=3
?"➡️ Next Task"
:"🔄 Try Again";

beep(false);

}

function wrongTriple(){

clearInterval(timer);

locked=true;

let f=$("fb");

f.className="feedback show try";

f.innerHTML=`

<div class="big" style="font-size:52px">
💪🌱🧠
</div>

<div class="ft">
Almost there! Keep going! 🚀
</div>

<p>
💡 One or more matches are incorrect.
Review the relationship between the event,
account and account nature, then use your next attempt.
</p>

`;

$("retry").style.display="inline-block";

$("retry").textContent=
attempt>=3
?"➡️ Next Task"
:"🔄 Try Again";

beep(false);

}

function retryStep(){

if(attempt>=3){

clearInterval(timer);

locked=true;

let f=$("fb");

f.className="feedback show try";

if(current===6){

const t=tasks[current];

const answers=t.rows.map((r,i)=>

`<div style="margin:8px 0">

<b>${i+1}. ${r[0]}</b><br>

➡️ <b>${r[1]}</b>
→
<b>${r[2]}</b>

</div>`

).join("");

f.innerHTML=`

<div class="big" style="font-size:52px">
💡📚🌱
</div>

<div class="ft">
Here are the correct answers — learn and continue!
</div>

<p>${answers}</p>

<p>
<b>Remember:</b>
identify the account involved first,
then its nature.
</p>

`;

}else{

f.innerHTML=`

<div class="big" style="font-size:52px">
🌱💪➡️
</div>

<div class="ft">
Good effort! Let's move forward.
</div>

<p>
You've used all 3 attempts.
No XP or coins are awarded for this task.
</p>

`;

}

$("retry").style.display="none";

$("continue").style.display="inline-block";

$("continue").textContent=
current===9
?"🏆 Finish Adventure"
:"Next Task →";

return;

}

attempt++;

setup(false);

}

function setup(resetAttempt=true){

clearInterval(timer);

if(resetAttempt)attempt=1;

locked=false;

header();

let t=tasks[current];

if(t.kind==="drag"){

const opts=[...t.items].sort(()=>Math.random()-.5);

shell(t,`

<h2>🎯 Your Mission</h2>

<div class="hint">
Drag one card into the target.
</div>

<div class="drop" id="target">
✨ DROP YOUR ANSWER HERE ✨
</div>

<div class="cards">

${opts.map(x=>

`<div class="term"
draggable="true"
data-v="${x}">
${x}
</div>`

).join("")}

</div>

`);

let d=$("target");

document.querySelectorAll(".term").forEach(x=>

x.ondragstart=e=>
e.dataTransfer.setData("text/plain",x.dataset.v)

);

d.ondragover=e=>{

e.preventDefault();

d.classList.add("over");

};

d.ondragleave=()=>
d.classList.remove("over");

d.ondrop=e=>{

e.preventDefault();

d.classList.remove("over");

let v=e.dataTransfer.getData("text/plain");

v===t.answer

?(

d.className="drop correct",

d.textContent="✅ "+v,

success(t.why)

)

:wrong(
"Money introduced by the owner into the business is called Capital."
);

};

}

if(t.kind==="match"){

shell(t,`

<h2>🔗 Match the Pairs</h2>

<div class="hint">
Choose the correct match for every row.
</div>

<div class="matchgrid">
