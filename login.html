<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Login — AccuNumbo</title>

    <link rel="stylesheet"
        href="styles.css">
</head>

<body>

<header class="navbar">

    <a class="brand" href="index.html">
        <img src="accunumbo-logo.png"
             alt="AccuNumbo Adventures logo">
    </a>

    <nav class="navlinks">

        <a href="index.html">
            🏠 HOME
        </a>

        <a href="adventures.html">
            🗺️ ADVENTURES
        </a>

        <a href="teachers.html">
            👨‍🏫 FOR TEACHERS
        </a>

        <a href="feedback.html">
            💬 FEEDBACK
        </a>

    </nav>

    <div class="user-actions">

        <a class="btn btn-outline"
           href="login.html">
            LOGIN
        </a>

    </div>

</header>


<main class="container">

    <div class="card form-card">

        <div class="section-title"
             style="margin-bottom:20px">

            <span class="pill">
                🔐 EXPLORER ACCOUNT
            </span>

            <h2>
                Welcome back!
            </h2>

            <p>
                Sign in to save your learning progress,
                XP, coins and badges.
            </p>

        </div>


        <!-- Messages appear here -->

        <div id="msg"></div>


        <!-- NAME -->

        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                id="name"
                type="text"
                autocomplete="name"
                placeholder="Your name">

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com">

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password">

        </div>


        <!-- BUTTONS -->

        <div style="
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        ">

            <button
                class="btn btn-gold"
                type="button"
                onclick="login()">

                LOGIN

            </button>


            <button
                class="btn btn-dark"
                type="button"
                onclick="signup()">

                CREATE ACCOUNT

            </button>

        </div>


        <div class="notice"
             style="margin-top:18px">

            Prototype note: this starter stores accounts
            in the included SQLite database.

        </div>

    </div>

</main>


<footer>

    <img src="accunumbo-logo.png"
         alt="AccuNumbo logo">

    <p>
        Experience First. Explanation Second.
    </p>

</footer>



<script>

/* =====================================================
   BASIC HELPERS
===================================================== */

const $ = (id) => {
    return document.getElementById(id);
};


/* =====================================================
   SHOW MESSAGE
===================================================== */

function msg(text, type) {

    const messageBox = $("msg");

    messageBox.innerHTML =
        `<div class="notice ${type}">
            ${text}
        </div>`;
}


/* =====================================================
   API CALL
   Handles JSON and non-JSON responses safely
===================================================== */

async function call(url, body) {

    const response = await fetch(url, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(body)

    });


    /*
       Read response as TEXT first.

       This prevents:
       Unexpected token '<'

       when the server accidentally returns HTML.
    */

    const text = await response.text();


    let data;

    try {

        data = JSON.parse(text);

    } catch (error) {

        console.error(
            "Server returned non-JSON:",
            text
        );

        throw new Error(
            "Server returned an unexpected response. Please try again."
        );
    }


    if (!response.ok) {

        throw new Error(
            data.message ||
            data.error ||
            "Request failed."
        );

    }


    return data;
}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

async function signup() {

    try {

        const name =
            $("name").value.trim();

        const email =
            $("email").value.trim();

        const password =
            $("password").value;


        /* Validation */

        if (!name || !email || !password) {

            msg(
                "Please fill in all fields.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            msg(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        msg(
            "Creating your account...",
            "success"
        );


        /*
           IMPORTANT:
           Your server.js uses /api/register
        */

        const data = await call(
            "/api/register",
            {
                name: name,
                email: email,
                password: password
            }
        );


        /* Save JWT */

        if (!data.token) {

            throw new Error(
                "Account was created, but no login token was received."
            );

        }


        localStorage.setItem(
            "accu_token",
            data.token
        );


        msg(
            "Account created successfully! Redirecting...",
            "success"
        );


        /* Go to dashboard */

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 700);


    } catch (error) {

        console.error(
            "Signup error:",
            error
        );

        msg(
            error.message ||
            "Account creation failed.",
            "error"
        );

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    try {

        const email =
            $("email").value.trim();

        const password =
            $("password").value;


        /* Login only needs email + password */

        if (!email || !password) {

            msg(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        msg(
            "Logging you in...",
            "success"
        );


        /*
           IMPORTANT:
           Your server.js uses:

           POST /api/login

           NOT /api/auth/login
        */

        const data = await call(
            "/api/login",
            {
                email: email,
                password: password
            }
        );


        console.log(
            "Login response:",
            data
        );


        /* Check token */

        if (!data.token) {

            throw new Error(
                "Login succeeded but no authentication token was received."
            );

        }


        /* Save token */

        localStorage.setItem(
            "accu_token",
            data.token
        );


        msg(
            "Login successful! Redirecting...",
            "success"
        );


        /*
           Redirect to dashboard
        */

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 700);


    } catch (error) {

        console.error(
            "Login error:",
            error
        );

        msg(
            error.message ||
            "Login failed. Please check your email and password.",
            "error"
        );

    }

}


/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

$("password").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

    }
);

</script>

</body>
</html>
