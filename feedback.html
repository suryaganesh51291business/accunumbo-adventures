<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AccuNumbo Adventures</title><link rel='stylesheet' href='styles.css'></head><body><header class="navbar"><a href="index.html"><img class="logo" src="assets/accunumbo-logo.png" alt="AccuNumbo Adventures"></a><nav class="navlinks"><a href="index.html">🏠 HOME</a><a href="adventures.html">🗺️ ADVENTURES</a><a href="adventures.html">🎮 GAMES</a><a href="adventures.html">🏪 SIMULATIONS</a><a href="teachers.html">👨‍🏫 FOR TEACHERS</a><a href="feedback.html">💬 FEEDBACK</a></nav><div class="user-actions"><a class="btn btn-outline" href="login.html">LOGIN</a><a class="btn btn-gold" href="login.html">SIGN UP FREE</a></div></header><main class="container"><div class="card form-card feedback"><h2>💬 Explorer Feedback</h2><p>Your feedback helps us improve AccuNumbo.</p><div id="msg"></div><div class="form-group"><label>Name (optional)</label><input id="name"></div><div class="form-group"><label>Email (optional)</label><input id="email" type="email"></div><div class="form-group"><label>How was your experience?</label><select id="rating"><option>★★★★★ — Excellent</option><option>★★★★☆ — Very good</option><option>★★★☆☆ — Good</option><option>★★☆☆☆ — Needs improvement</option><option>★☆☆☆☆ — Poor</option></select></div><div class="form-group"><label>What did you enjoy?</label><textarea id="enjoy"></textarea></div><div class="form-group"><label>What should we improve?</label><textarea id="improve"></textarea></div><button class="btn btn-gold" style="width:100%" onclick="submitFeedback()">SUBMIT FEEDBACK</button><div class="notice" style="margin-top:15px">Only information you choose to submit is stored in this prototype. Production launch will use secure storage and a clear privacy policy.</div></div></main><footer><img src="assets/accunumbo-logo.png"></footer><script>
async function submitFeedback(){let f={name:document.getElementById('name').value,email:document.getElementById('email').value,rating:document.getElementById('rating').value,enjoyed:document.getElementById('enjoy').value,improve:document.getElementById('improve').value};let h={'Content-Type':'application/json'};let t=localStorage.getItem('accu_token');if(t)h.Authorization='Bearer '+t;let r=await fetch('/api/feedback',{method:'POST',headers:h,body:JSON.stringify(f)}),d=await r.json();document.getElementById('msg').innerHTML='<div class="notice '+(r.ok?'success':'error')+'">'+(r.ok?'🎉 Thank you! Your feedback has been submitted.':d.error)+'</div>'}
</script></body></html>
