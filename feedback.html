<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback — AccuNumbo</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="navbar"><a class="brand" href="index.html"><img src="accunumbo-logo.png" alt="AccuNumbo Adventures logo"></a><nav class="navlinks"><a href="index.html">🏠 HOME</a><a href="adventures.html">🗺️ ADVENTURES</a><a href="teachers.html">👨‍🏫 FOR TEACHERS</a><a class="active" href="feedback.html">💬 FEEDBACK</a></nav><div class="user-actions"><a class="btn btn-outline" href="login.html">LOGIN</a><a class="btn btn-gold" href="login.html">SIGN UP FREE</a></div></header>
<main class="container"><div class="card form-card"><div class="section-title" style="margin-bottom:20px"><span class="pill">💬 YOUR VOICE MATTERS</span><h2>Explorer Feedback</h2><p>Your feedback helps shape the next AccuNumbo experience.</p></div><div id="msg"></div><div class="form-group"><label>Name (optional)</label><input id="name"></div><div class="form-group"><label>Email (optional)</label><input id="email" type="email"></div><div class="form-group"><label>How was your experience?</label><select id="rating"><option value="5">★★★★★ — Excellent</option><option value="4">★★★★☆ — Very good</option><option value="3">★★★☆☆ — Good</option><option value="2">★★☆☆☆ — Needs improvement</option><option value="1">★☆☆☆☆ — Poor</option></select></div><div class="form-group"><label>What did you enjoy?</label><textarea id="enjoy"></textarea></div><div class="form-group"><label>What should we improve?</label><textarea id="improve"></textarea></div><button class="btn btn-gold" style="width:100%" onclick="submitFeedback()">SUBMIT FEEDBACK</button></div></main><footer><img src="accunumbo-logo.png"></footer>
<script>async function submitFeedback(){const t=localStorage.getItem('accu_token');const h={'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;const body={name:name.value,email:email.value,rating:rating.value,enjoyed:enjoy.value,improve:improve.value};const r=await fetch('/api/feedback',{method:'POST',headers:h,body:JSON.stringify(body)});const d=await r.json();msg.innerHTML=`<div class="notice ${r.ok?'success':'error'}">${r.ok?'🎉 Thank you for helping us improve AccuNumbo.':d.error}</div>`}</script></body></html>
