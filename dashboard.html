<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AccuNumbo Adventures</title><link rel='stylesheet' href='styles.css'></head><body><header class="navbar"><a href="index.html"><img class="logo" src="assets/accunumbo-logo.png" alt="AccuNumbo Adventures"></a><nav class="navlinks"><a href="index.html">🏠 HOME</a><a href="adventures.html">🗺️ ADVENTURES</a><a href="adventures.html">🎮 GAMES</a><a href="adventures.html">🏪 SIMULATIONS</a><a href="teachers.html">👨‍🏫 FOR TEACHERS</a><a href="feedback.html">💬 FEEDBACK</a></nav><div class="user-actions"><a class="btn btn-outline" href="login.html">LOGIN</a><a class="btn btn-gold" href="login.html">SIGN UP FREE</a></div></header><main class="container"><div id="welcome"></div><div class="stats"><div class="stat"><strong id="xp">0</strong><small>⭐ XP</small></div><div class="stat"><strong id="coins">0</strong><small>🪙 Coins</small></div><div class="stat"><strong id="badges">0</strong><small>🏆 Badges</small></div><div class="stat"><strong id="progress">0%</strong><small>🗺️ Progress</small></div></div><div class="grid" style="margin-top:20px"><div class="card"><div class="icon">🌱</div><h3>Adventure 1</h3><p id="status">Ready to begin.</p><a class="btn btn-gold" href="adventures.html">CONTINUE</a></div><div class="card"><div class="icon">💬</div><h3>Feedback</h3><p>Tell us what you enjoyed and what we should improve.</p><a class="btn btn-dark" href="feedback.html">GIVE FEEDBACK</a></div><div class="card"><div class="icon">👤</div><h3>Account</h3><p id="account"></p><button class="btn btn-dark" onclick="logout()">LOG OUT</button></div></div></main><footer><img src="assets/accunumbo-logo.png"></footer><script>
async function load(){let t=localStorage.getItem('accu_token');if(!t){location.href='login.html';return}
let r=await fetch('/api/me',{headers:{Authorization:'Bearer '+t}});if(!r.ok){localStorage.removeItem('accu_token');location.href='login.html';return}
let d=await r.json(),p=d.progress.find(x=>x.adventure===1)||{xp:0,coins:0,badges:0,completed_tasks:0};
document.getElementById('welcome').innerHTML='<h1>Welcome back, '+d.user.name+'! 🚀</h1><p style="color:#667085">'+d.user.email+'</p>';
document.getElementById('account').textContent=d.user.email;document.getElementById('xp').textContent=p.xp;document.getElementById('coins').textContent=p.coins;document.getElementById('badges').textContent=p.badges;document.getElementById('progress').textContent=Math.round((p.completed_tasks/10)*100)+'%';
}
function logout(){localStorage.removeItem('accu_token');location.href='index.html'} load();
</script></body></html>
